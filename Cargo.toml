[package]
name = "audioedit"
version = "0.1.0"
edition = "2021"
description = "Vim-like TUI audio editor: browse, play, trim and edit metadata for audio files"

[lib]
name = "audioedit"
path = "src/lib.rs"

[[bin]]
name = "audioedit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
ratatui = "0.30"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
unicode-width = "0.2"

[profile.release]
opt-level = 2
